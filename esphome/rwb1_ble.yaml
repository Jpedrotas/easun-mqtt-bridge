substitutions:
  device_name: easun-rwb1
  friendly_name: EASUN RWB1
  update_interval: 2s
  activity_led_pin: GPIO8

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source: github://jpedrotas/easun-mqtt-bridge@v0.4.0
    components: [rwb1_ble]
    refresh: 1d

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

rwb1_ble:
  dtu_id: !secret rwb1_dtu_id
  update_interval: ${update_interval}
  activity_led:
    number: ${activity_led_pin}
    inverted: true
    ignore_strapping_warning: true
  status_code:
    name: Status Code
  grid_voltage:
    name: Grid Voltage
  grid_frequency:
    name: Grid Frequency
  pv_voltage:
    name: PV Voltage
  pv_power:
    name: PV Power
  battery_voltage:
    name: Battery Voltage
  battery_soc:
    name: Battery State of Charge
  battery_charge_current:
    name: Battery Charge Current
  battery_discharge_current:
    name: Battery Discharge Current
  output_voltage:
    name: Output Voltage
  output_frequency:
    name: Output Frequency
  load_apparent_power:
    name: Load Apparent Power
  load_active_power:
    name: Load Active Power
  load_percent:
    name: Load Percentage
  rated_power:
    name: Rated Power
