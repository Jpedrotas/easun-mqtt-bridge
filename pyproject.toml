[project]
name = "easun-mqtt-bridge"
version = "0.3.3"
description = "Local read-only telemetry bridge for EASUN RWB1 dataloggers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EASUN MQTT Bridge contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.scripts]
easun-mqtt-bridge = "easun_bridge.easun_bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["easun_bridge"]
