name: EASUN MQTT Bridge
version: "0.3.1"
slug: easun_mqtt_bridge
description: Local read-only telemetry bridge for EASUN RWB1 dataloggers
url: https://github.com/jpedrotas/easun-mqtt-bridge
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
stage: experimental
watchdog: tcp://[HOST]:18830
services:
  - mqtt:need
ports:
  18830/tcp: 18830
ports_description:
  18830/tcp: Transparent MQTT proxy for the datalogger
options:
  upstream_host: ""
  upstream_port: 1883
  poll_interval: 2.0
  verbose: false
schema:
  upstream_host: str
  upstream_port: port
  poll_interval: float(0,60)
  verbose: bool
